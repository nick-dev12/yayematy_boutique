; Réglages PHP (PHP-FPM / CGI — Namecheap, cPanel, etc.).
; IMPORTANT : ne pas mettre session.save_path vers /var/webuzo-data/... (VPS) :
; les sessions sont gérées dans storage/sessions via includes/session_user.php.
default_charset = "UTF-8"
session.gc_maxlifetime = 2592000
session.cookie_lifetime = 2592000
upload_max_filesize = 1000M
post_max_size = 1000M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
